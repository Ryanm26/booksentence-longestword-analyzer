<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Sentence & Longest Word Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #controls { margin-bottom: 15px; }
    input[type="number"] { width: 80px; }
  </style>
</head>
<body>
  <h2>Book Sentence & Longest Word Analyzer</h2>

  <div id="controls">
    <input type="file" id="fileInput" accept=".txt" multiple>
    <button id="analyzeBtn">Analyze & Download CSV</button>
    <button id="clearBtn">Clear</button>
    <br><br>

    <h3>Random Sampling</h3>
    <label>Sample %: <input type="number" id="samplePercent" min="1" max="100" value="10"></label>
    <button id="sampleBtn">Run Random Sample</button>
    <br><br>

    <h3>Trim Outliers</h3>
    <label>Trim top/bottom %: <input type="number" id="trimPercent" min="1" max="40" value="5"></label>
    <button id="trimBtn">Trim & Recalculate</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const trimBtn = document.getElementById('trimBtn');

    let rows = [];

    analyzeBtn.addEventListener('click', handleAnalyze);
    sampleBtn.addEventListener('click', handleSample);
    trimBtn.addEventListener('click', handleTrim);
    clearBtn.addEventListener('click', clearAll);

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result || '');
        reader.onerror = e => reject(e);
        reader.readAsText(file);
      });
    }

    function handleAnalyze() {
      const files = fileInput.files;
      if (!files.length) return alert("Select .txt files first.");

      Promise.all([...files].map(readFileAsText)).then(texts => {
        processText(texts.join("\n"));
        createCSV(rows);
      });
    }

    function handleSample() {
      if (rows.length === 0) return alert("Run full analysis first.");

      const pct = parseFloat(document.getElementById("samplePercent").value) / 100;
      if (pct <= 0 || pct > 1) return alert("Invalid percentage.");

      const shuffled = [...rows].sort(() => Math.random() - 0.5);
      const sampleSize = Math.max(1, Math.floor(shuffled.length * pct));
      const sample = shuffled.slice(0, sampleSize);

      createCSV(sample);
    }

    function handleTrim() {
      if (rows.length === 0) return alert("Run full analysis first.");

      const pct = parseFloat(document.getElementById("trimPercent").value) / 100;
      if (pct <= 0 || pct >= 0.5) return alert("Percentage must be between 1 and 40.");

      const sorted = [...rows].sort((a, b) => a.len - b.len);
      const cut = Math.floor(sorted.length * pct);
      const trimmed = sorted.slice(cut, sorted.length - cut);

      createCSV(trimmed);
    }

    function processText(text) {
      rows = [];
      const sentences = text.split(/(?<=[\.!?])\s+/);

      for (let s of sentences) {
        s = s.trim();
        if (!s) continue;

        const cleaned = s.replace(/[^A-Za-z]+/g, " ");
        const words = cleaned.split(/\s+/).filter(w => w.length > 0);
        if (!words.length) continue;

        let longest = "";
        for (let w of words) if (w.length > longest.length) longest = w;

        rows.push({
          len: words.length,
          longestLen: longest.length,
          longestWord: longest
        });
      }
    }

    function createCSV(dataset) {
      let csv = "sentence_length,longest_word_length,longest_word\n";
      dataset.forEach(r => {
        csv += `${r.len},${r.longestLen},"${r.longestWord.replace(/"/g, '""')}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sentence_longest_word_stats.csv";
      a.click();
    }

    function clearAll() {
      rows = [];
      fileInput.value = "";
    }
  </script>
</body>
</html>
